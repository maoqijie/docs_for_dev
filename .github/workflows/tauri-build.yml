name: Tauri Build

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Decide build eligibility
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.head_commit.message }}" == build* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libglib2.0-dev

      - name: Install UI deps
        run: npm ci
        working-directory: UI

      - name: Build UI
        run: npm run build
        working-directory: UI

      - name: Verify dist
        run: |
          DIST="${{ github.workspace }}/UI/dist"
          ls -la "$DIST"
          test -f "$DIST/index.html"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_DIST_DIR: ${{ github.workspace }}/UI/dist
        with:
          projectPath: Backend/src-tauri
          distPath: ${{ github.workspace }}/UI/dist

      - name: Upload bundle (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: Backend/src-tauri/target/release/bundle/**

  build-macos:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI deps
        run: npm ci
        working-directory: UI

      - name: Build UI
        run: npm run build
        working-directory: UI

      - name: Verify dist
        run: |
          DIST="${{ github.workspace }}/UI/dist"
          ls -la "$DIST"
          test -f "$DIST/index.html"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_DIST_DIR: ${{ github.workspace }}/UI/dist
        with:
          projectPath: Backend/src-tauri
          distPath: ${{ github.workspace }}/UI/dist

      - name: Upload bundle (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: Backend/src-tauri/target/release/bundle/**

  build-windows:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI deps
        run: npm ci
        working-directory: UI

      - name: Build UI
        run: npm run build
        working-directory: UI

      - name: Verify dist
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}\UI\dist"
          Get-ChildItem $dist
          if (-not (Test-Path "$dist\index.html")) { throw "dist missing index.html" }

      - name: Ensure Windows icon
        shell: pwsh
        run: |
          python -m pip install --user pillow
          python -c "from pathlib import Path; from PIL import Image; p=Path('Backend/src-tauri/icons/icon.png'); ico=p.with_suffix('.ico'); img=Image.open(p); sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]; img.save(ico, format='ICO', sizes=sizes); print(f'Generated {ico} from {p}')"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_DIST_DIR: ${{ github.workspace }}\UI\dist
        with:
          projectPath: Backend/src-tauri
          distPath: ${{ github.workspace }}/UI/dist

      - name: Upload bundle (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: Backend/src-tauri/target/release/bundle/**

  release:
    needs: [gate, build-linux, build-macos, build-windows]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.sha }}
          name: ${{ github.event.head_commit.message || format('build {0}', github.sha) }}
          body: |
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message || 'manual dispatch' }}
          files: artifacts/**
